<!-- ===== 数据配置（只改这几个文件就能更新教材内容） ===== -->
<script src="data/config.js"></script>
<script src="data/chinese-data.js"></script>
<!-- 课文全文（覆盖 chinese-data.js 里的片段；缺哪课就补在哪个文件里） -->
<script src="data/full-4a.js"></script>
<script src="data/full-4b.js"></script>
<!-- 每课「词语表」（课本附录，用于听写） -->
<script src="data/word-data.js"></script>
<script src="data/essay-data.js"></script>
<script src="data/english-data.js"></script>
<script src="data/math-data.js"></script>
<!-- 纯前端 OCR 引擎（数学拍照识别知识点用，无需后端/密钥，全部资源本地自托管 → 断网也能用）。
     仅首页与数学页会用到，放 body 末尾不影响首屏；加载完 window.Tesseract 才存在。
     ★ 资源都在 vendor/tesseract/（tesseract.min.js / worker.min.js / tesseract-core-*.wasm(.js) / lang/chi_sim.traineddata.gz），
        math.js 的 createWorker 用 workerPath/corePath/langPath 指到本地，故完全离线。 -->
<script src="vendor/tesseract/tesseract.min.js"></script>
<!-- ===== 本地神经语音（Piper · VITS · 华研女声）—— 离线兜底 =====
     全部资源自托管在 vendor/piper/（模型 63MB + espeak 18MB + onnxruntime 10MB），浏览器内 WASM 推理，
     断网也能用、零账号零密钥，作为在线通道不可用时的兜底。ort.min.js 是 UMD（提供全局 window.ort），
     必须在本模块之前加载；piper-tts.js 是 ES module（提供 window.PiperTTS），defer 执行，不影响首屏。 -->
<script src="vendor/piper/ort/ort.min.js"></script>
<script type="module" src="js/piper-tts.js"></script>
<!-- ===== 在线神经语音（Edge-TTS · 微软晓晓）—— 语文朗读「有感情」主引擎 =====
     浏览器原生 WebSocket 直连微软云端，无需密钥/Cloudflare/大体积下载；断网时由 core.js 自动降级。 -->
<script src="js/edge-tts.js"></script>
<!-- ===== 程序逻辑 ===== -->
<script src="js/core.js"></script>
<script src="js/accounts.js"></script>
<script src="js/chinese.js"></script>
<script src="js/math.js"></script>
<script src="js/english.js"></script>
<script src="js/app.js"></script>
</body>
